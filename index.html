/* =========================
   DATE FUNCTIONS
========================= */

function formatDate(date){

  const y=date.getFullYear();

  const m=String(date.getMonth()+1).padStart(2,"0");

  const d=String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;

}


function parseDate(str){

  const parts=str.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2])
  );

}


function getDates(){

  const dates=[];

  let current=parseDate(startDate);

  const end=parseDate(endDate);

  while(current<=end){

    dates.push(formatDate(current));

    current.setDate(current.getDate()+1);

  }

  return dates;

}


const dates=getDates();


/* =========================
   DATE LABEL
========================= */

function shortDate(date){

  const d=parseDate(date);

  return String(d.getDate()).padStart(2,"0")
    +"."
    +String(d.getMonth()+1).padStart(2,"0");

}


/* =========================

];


/* =========================
   LOCK REASON
========================= */

function getLockReason(date){

  const d=parseDate(date);

  const today=new Date();

  today.setHours(0,0,0,0);

  if(d<today){

    return "O‘tgan kun";

  }

  if(d.getDay()===0){

    return "Yakshanba";

  }

  if(holidays[date]){

    return holidays[date];

  }

  for(const vacation of vacations){

    if(
      date>=vacation.start &&
      date<=vacation.end
    ){

      return vacation.name;

    }

  }

  return "";

}


/* =========================
   IS LOCKED
========================= */

function isLocked(date){

  return getLockReason(date)!=="";

}


/* =========================
   CURRENT DATE
========================= */

function isToday(date){

  return formatDate(new Date())===date;

}


/* =========================
   BUILD TABLE
========================= */

function buildTable(){

  const head=document.getElementById("attendanceHead");

  const body=document.getElementById("attendanceBody");

  head.innerHTML="";

  body.innerHTML="";


  const tr=document.createElement("tr");

  const numberTh=document.createElement("th");

  numberTh.textContent="№";

  tr.appendChild(numberTh);


  const studentTh=document.createElement("th");

  studentTh.textContent="Ism va Familya";

  studentTh.className="studentHeader";

  tr.appendChild(studentTh);


  dates.forEach(date=>{

    const th=document.createElement("th");

    th.className="dateHeader";

    if(isToday(date)){

      th.classList.add("todayColumn");

    }

    const d=parseDate(date);

    th.innerHTML=
      `${shortDate(date)}<br>${dayNames[d.getDay()]}`;

    tr.appendChild(th);

  });


  head.appendChild(tr);


  students.forEach((student,index)=>{

    const tr=document.createElement("tr");


    const numberTd=document.createElement("td");

    numberTd.textContent=index+1;

    tr.appendChild(numberTd);


    const nameTd=document.createElement("td");

    nameTd.textContent=student;

    nameTd.className="studentName";

    tr.appendChild(nameTd);


    dates.forEach(date=>{

      const td=document.createElement("td");

      if(isToday(date)){

        td.classList.add("todayColumn");

      }


      if(isLocked(date)){

        td.classList.add("lockedCell");

      }


      const key=getAttendanceKey(student,date);

      const value=attendanceData[key]||"";


      const button=document.createElement("button");

      button.className="attendanceBtn";


      if(isLocked(date)){

        button.classList.add("lockedBtn");

        button.textContent="−";

        button.title=getLockReason(date);

      }

      else if(value==="present"){

        button.classList.add("presentBtn");

        button.textContent="+";

      }

      else if(value==="absent"){

        button.classList.add("absentBtn");

        button.textContent="−";

      }

      else{

        button.classList.add("emptyBtn");

        button.textContent="";

      }


      if(
        currentUser &&
        currentUser.canEdit &&
        !isLocked(date)
      ){

        button.onclick=()=>toggleAttendance(
          student,
          date
        );

      }


      td.appendChild(button);

      tr.appendChild(td);

    });


    body.appendChild(tr);

  });

}


/* =========================
   ATTENDANCE KEY
========================= */

function getAttendanceKey(student,date){

  return `${date}__${student}`;

}


/* =========================
   TOGGLE ATTENDANCE
========================= */

async function toggleAttendance(student,date){

  if(!currentUser || !currentUser.canEdit){

    return;

  }

  if(isLocked(date)){

    return;

  }


  const key=getAttendanceKey(student,date);

  const current=attendanceData[key]||"";


  if(current===""){

    attendanceData[key]="present";

  }

  else if(current==="present"){

    attendanceData[key]="absent";

  }

  else{

    attendanceData[key]="";

  }


  buildTable();

  await saveData();

}

    alert(

function startFirebaseListener(){

  if(firebaseStarted){

    return;

  }

  firebaseStarted=true;


  const databaseRef=
    ref(db,"davomat_jurnali");


  onValue(
    databaseRef,
    snapshot=>{

      attendanceData=
        snapshot.val() || {};

      buildTable();

    },
    error=>{

      console.error(error);

      alert(
        "Firebase ma’lumotlarini olishda xatolik:\n"+
        error.message
      );

    }
  );

}

/* =========================
   LOGIN
========================= */

window.login=async function(){

  const username=
    document.getElementById("username")
      .value.trim()
      .toLowerCase();

  const password=
    document.getElementById("password")
      .value;

  const remember=
    document.getElementById("rememberLogin")
      .checked;


  showLoginError("");


  if(!username){

    showLoginError("Loginni kiriting!");

    return;

  }


  if(!password){

    showLoginError("Parolni kiriting!");

    return;

  }


  const email=loginAccounts[username];


  if(!email){

    showLoginError(
      "Login yoki parol noto‘g‘ri!"
    );

    return;

  }


  const loginButton=
    document.getElementById("loginButton");

  loginButton.disabled=true;

  loginButton.textContent="⏳ Kirilmoqda...";


  try{

    /*
      ENG MUHIM O'ZGARISH:

      Firebase Authentication orqali
      email + parol tekshiriladi.
    */

    const result=
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user=result.user;


    /*
      UID o'rniga email orqali
      editor huquqini tekshiramiz.
    */

    if(
      !user.email ||
      !editorEmails.includes(
        user.email.toLowerCase()
      )
    ){

      await signOut(auth);

      showLoginError(
        "Bu Firebase akkauntiga editor ruxsati berilmagan!"
      );

      return;

    }


    currentUser={

      username:username,

      name:
        username==="abdulloh04072009"
          ? "Abdulloh"
          : "Muhammadali",

      canEdit:true,

      mode:"editor",

      uid:user.uid,

      email:user.email

    };


    if(remember){

      localStorage.setItem(
        "davomat_login",
        username
      );

    }
    else{

      localStorage.removeItem(
        "davomat_login"
      );

    }


    sessionStorage.setItem(
      "davomat_user",
      JSON.stringify(currentUser)
    );


    showLoginError("");

    showMain();

    startFirebaseListener();


  }
  catch(error){

    console.error(
      "Firebase login error:",
      error
    );


    /*
      Endi barcha Firebase xatolari
      bir xil "Login noto‘g‘ri" bo‘lib
      qolmaydi.
    */

    switch(error.code){

      case "auth/invalid-credential":

      case "auth/wrong-password":

      case "auth/user-not-found":

      case "auth/invalid-email":

        showLoginError(
          "Login yoki parol noto‘g‘ri!"
        );

        break;


      case "auth/too-many-requests":

        showLoginError(
          "Juda ko‘p urinish bo‘ldi. Birozdan keyin qayta urinib ko‘ring."
        );

        break;


      case "auth/user-disabled":

        showLoginError(
          "Bu Firebase akkaunti bloklangan."
        );

        break;


      case "auth/network-request-failed":

        showLoginError(
          "Internet yoki Firebase ulanishida muammo."
        );

        break;


      default:

        showLoginError(
          "Kirishda xatolik: "+
          (error.message || error.code)
        );

    }

  }
  finally{

    loginButton.disabled=false;

    loginButton.textContent="🔐 Kirish";

  }

};

/* =========================
   STUDENT STATS
========================= */

function getStudentStats(student){

  let total=0;

  let present=0;

  let absent=0;


  dates.forEach(date=>{

    if(isLocked(date)){

      return;

    }


    if(lessonsPerDay[
      parseDate(date).getDay()
    ]===0){

      return;

    }


    const key=
      getAttendanceKey(
        student,
        date
      );


    const value=
      attendanceData[key] || "";


    if(value==="present"){

      total++;

      present++;

    }
    else if(value==="absent"){

      total++;

      absent++;

    }

  });


  const percent=
    total===0
      ? 0
      : Math.round(
          present/total*100
        );


  return{
    total,
    present,
    absent,
    percent
  };

}

  const today=
    formatDate(new Date());


  const date=
    dates.includes(today)
      ? today
      : dates[dates.length-1];


  let present=0;

  let absent=0;


  students.forEach(student=>{

    const value=
      attendanceData[
        getAttendanceKey(
          student,
          date
        )
      ] || "";


    if(value==="present"){

      present++;

    }
    else if(value==="absent"){

      absent++;

    }

  });


  const total=present+absent;

  const percent=
    total===0
      ? 0
      : Math.round(
          present/total*100
        );


  content.innerHTML=`

    <div class="statCards">

      <div class="statCard">
        ❌ Qoldirdi
        <strong>${absent}</strong>
      </div>

      <div class="statCard">
        📊 Davomat
        <strong>${percent}%</strong>
      </div>

    </div>

  `;

}


/* =========================
   WEEKLY REPORT
========================= */

function renderWeeklyReport(content){

  const now=new Date();

  const day=now.getDay();

  const diff=day===0 ? 6 : day-1;


  const monday=
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()-diff
    );


  let weekDates=[];


  for(let i=0;i<7;i++){

    const d=new Date(monday);

    d.setDate(
      monday.getDate()+i
    );


    const str=formatDate(d);


    if(
      str>=startDate &&
      str<=endDate
    ){

      weekDates.push(str);

    }

  }


  let total=0;

  let present=0;

  let absent=0;


  weekDates.forEach(date=>{

    if(isLocked(date)){

      return;

    }


    students.forEach(student=>{

      const value=
        attendanceData[
          getAttendanceKey(
            student,
            date
          )
        ] || "";


      if(value==="present"){

        total++;

        present++;

      }
      else if(value==="absent"){

        total++;

        absent++;

      }

    });

  });


  const percent=
    total===0
      ? 0
      : Math.round(
          present/total*100
        );


  content.innerHTML=`

    <h3>📅 HAFTALIK HISOBOT</h3>

    <p style="margin:10px 0">
      🗓 Belgilangan kunlar:
      <b>${weekDates.length}</b>
    </p>

    <div class="statCards">

      <div class="statCard">
        🗓 Belgilangan
        <strong>${total}</strong>
      </div>

      <div class="statCard">
        ✅ Keldi
        <strong>${present}</strong>
      </div>

      <div class="statCard">
        ❌ Qoldirdi
        <strong>${absent}</strong>
      </div>

      <div class="statCard">
        📊 Davomat
        <strong>${percent}%</strong>
      </div>

    </div>

  `;

}


/* =========================
   MONTHLY REPORT
========================= */

function renderMonthlyReport(content){

  const now=new Date();

  const year=now.getFullYear();

  const month=
    String(now.getMonth()+1)
      .padStart(2,"0");


  const prefix=
    `${year}-${month}`;


  let total=0;

  let present=0;

  let absent=0;

  let countedDays=0;


  dates.forEach(date=>{

    if(!date.startsWith(prefix)){

      return;

    }


    if(isLocked(date)){

      return;

    }


    countedDays++;


    students.forEach(student=>{

      const value=
        attendanceData[
          getAttendanceKey(
            student,
            date
          )
        ] || "";


      if(value==="present"){

        total++;

        present++;

      }
      else if(value==="absent"){

        total++;

        absent++;

      }

    });

  });


  const percent=
    total===0
      ? 0
      : Math.round(
          present/total*100
        );


  content.innerHTML=`

    <h3>📈 OYLIK HISOBOT</h3>

    <p style="margin:10px 0">
      📅 Oy:
      <b>M${Number(month)}</b>
    </p>

    <p style="margin:10px 0">
      🗓 Belgilangan kunlar:
      <b>${countedDays}</b>
    </p>

    <div class="statCards">

      <div class="statCard">
        🗓 Belgilangan
        <strong>${total}</strong>
      </div>

      <div class="statCard">
        ✅ Keldi
        <strong>${present}</strong>
      </div>

      <div class="statCard">
        ❌ Qoldirdi
        <strong>${absent}</strong>
      </div>

      <div class="statCard">
        📊 Davomat
        <strong>${percent}%</strong>
      </div>

    </div>

  `;

}
